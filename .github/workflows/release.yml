name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build, e.g. 0.1.0"
        required: true

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build image
        run: docker build -t taskboard:${{ inputs.version }} .
      - name: Smoke test the image
        run: docker run --rm taskboard:${{ inputs.version }} list
